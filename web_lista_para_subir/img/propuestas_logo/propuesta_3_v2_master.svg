<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="50%" stop-color="#101218"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <linearGradient id="rubyWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E0818"/>
      <stop offset="50%" stop-color="#3A040E"/>
      <stop offset="100%" stop-color="#140206"/>
    </linearGradient>

    <linearGradient id="gold3DMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E2"/>
      <stop offset="24%" stop-color="#F2D17E"/>
      <stop offset="52%" stop-color="#B07E22"/>
      <stop offset="78%" stop-color="#FCE7AA"/>
      <stop offset="100%" stop-color="#744E0E"/>
    </linearGradient>

    <linearGradient id="chrome3DMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E4E9F2"/>
      <stop offset="58%" stop-color="#8993A6"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#565E6E"/>
    </linearGradient>

    <filter id="studioDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Diagonal Split Background -->
  <rect width="1200" height="800" fill="url(#obsidianWall)"/>
  <polygon points="860,0 1200,0 1200,800 320,800" fill="url(#rubyWall)"/>

  <!-- Glowing Golden Laser Divider -->
  <line x1="860" y1="0" x2="320" y2="800" stroke="#FFF4CC" stroke-width="5" opacity="0.95"/>
  <line x1="860" y1="0" x2="320" y2="800" stroke="#D4AF37" stroke-width="14" opacity="0.35"/>

  <!-- Bold Architectural SF -->
  <g filter="url(#studioDrop)">
    <text x="465" y="455"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="330"
          font-weight="900"
          text-anchor="middle"
          fill="url(#gold3DMaster)"
          stroke="#5C0818"
          stroke-width="6">S</text>

    <text x="735" y="455"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="330"
          font-weight="900"
          text-anchor="middle"
          fill="url(#chrome3DMaster)"
          stroke="#5C0818"
          stroke-width="6">F</text>

    <!-- Obsidian & Gold Pill Badge -->
    <rect x="300" y="520" width="600" height="88" rx="18" fill="#090A0F" stroke="url(#gold3DMaster)" stroke-width="4"/>
    <text x="600" y="576"
          font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
          font-size="36"
          font-weight="700"
          letter-spacing="13"
          text-anchor="middle"
          fill="#F2F5FA">ENTRETENIMIENTO</text>
  </g>
</svg>