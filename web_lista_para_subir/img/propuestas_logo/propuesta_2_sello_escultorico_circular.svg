<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgObsidian2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0A070A"/>
      <stop offset="100%" stop-color="#1E040A"/>
    </linearGradient>

    <radialGradient id="medallionCore" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4A0714"/>
      <stop offset="55%" stop-color="#140307"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#E8C674"/>
      <stop offset="50%" stop-color="#A87920"/>
      <stop offset="78%" stop-color="#F7DF9C"/>
      <stop offset="100%" stop-color="#6E4A0E"/>
    </linearGradient>

    <linearGradient id="platinumFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#DCE1EB"/>
      <stop offset="70%" stop-color="#858E9E"/>
      <stop offset="100%" stop-color="#F2F5FA"/>
    </linearGradient>

    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="800" height="800" rx="44" fill="url(#bgObsidian2)"/>

  <!-- Imperial Octagonal / Circular Medallion -->
  <g filter="url(#crestShadow)">
    <circle cx="400" cy="330" r="225" fill="url(#medallionCore)" stroke="url(#goldRim)" stroke-width="10"/>
    <circle cx="400" cy="330" r="204" fill="none" stroke="url(#goldRim)" stroke-width="1.8" stroke-dasharray="10 6" stroke-opacity="0.75"/>
    <circle cx="400" cy="330" r="190" fill="none" stroke="url(#goldRim)" stroke-width="1.2" stroke-opacity="0.45"/>
  </g>

  <!-- Crown Star inside Crest -->
  <polygon points="400,158 405,173 420,178 405,183 400,198 395,183 380,178 395,173" fill="url(#goldRim)"/>

  <!-- Bold, Unmistakable Architectural SF Inside Medallion -->
  <g filter="url(#crestShadow)">
    <text x="332" y="418"
          font-family="'Montserrat', 'Arial Black', 'Segoe UI', sans-serif"
          font-size="235"
          font-weight="900"
          text-anchor="middle"
          fill="url(#goldRim)"
          stroke="#FFF7DF"
          stroke-width="2">S</text>

    <text x="478" y="418"
          font-family="'Montserrat', 'Arial Black', 'Segoe UI', sans-serif"
          font-size="235"
          font-weight="900"
          text-anchor="middle"
          fill="url(#platinumFace)"
          stroke="url(#goldRim)"
          stroke-width="2.5">F</text>
  </g>

  <!-- Bottom Subtitle -->
  <text x="400" y="632"
        font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
        font-size="40"
        font-weight="800"
        letter-spacing="12"
        text-anchor="middle"
        fill="url(#goldRim)">SF ENTRETENIMIENTO</text>

  <text x="400" y="678"
        font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="10"
        text-anchor="middle"
        fill="#D5DBE6"
        opacity="0.85">VALENCIA • MARACAY • PUERTO CABELLO</text>
</svg>