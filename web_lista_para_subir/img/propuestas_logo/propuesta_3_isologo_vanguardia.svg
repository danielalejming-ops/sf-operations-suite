<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 128-degree Luxury Plaque Gradient -->
    <linearGradient id="plaqueBg" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="45%" stop-color="#0D080B"/>
      <stop offset="78%" stop-color="#4A0714"/>
      <stop offset="100%" stop-color="#120307"/>
    </linearGradient>

    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7DF"/>
      <stop offset="22%" stop-color="#F0CE7D"/>
      <stop offset="50%" stop-color="#B07E22"/>
      <stop offset="78%" stop-color="#FBE5A7"/>
      <stop offset="100%" stop-color="#754F0E"/>
    </linearGradient>

    <linearGradient id="chrome3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E3E8F2"/>
      <stop offset="58%" stop-color="#7F889B"/>
      <stop offset="85%" stop-color="#F8FAFD"/>
      <stop offset="100%" stop-color="#525A6B"/>
    </linearGradient>

    <filter id="heavy3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.92"/>
    </filter>
  </defs>

  <!-- Outer Plaque -->
  <rect width="800" height="800" rx="44" fill="url(#plaqueBg)"/>
  
  <!-- Diagonal Golden Laser Line -->
  <line x1="80" y1="680" x2="720" y2="120" stroke="url(#gold3D)" stroke-width="1.5" stroke-opacity="0.22"/>

  <!-- Metallic Inner Plaque Card -->
  <rect x="65" y="110" width="670" height="580" rx="34" fill="#09070A" fill-opacity="0.72" stroke="url(#gold3D)" stroke-width="2.5" filter="url(#heavy3D)"/>

  <!-- 3D Extruded Modern Corporate SF -->
  <g filter="url(#heavy3D)">
    <!-- 3D Depth Layer -->
    <text x="326" y="446"
          font-family="'Arial Black', 'Montserrat', 'Segoe UI', sans-serif"
          font-size="270"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          fill="#3A2406">S</text>
    <text x="476" y="446"
          font-family="'Arial Black', 'Montserrat', 'Segoe UI', sans-serif"
          font-size="270"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          fill="#262B36">F</text>

    <!-- Front Brushed Metallic Faces -->
    <text x="320" y="438"
          font-family="'Arial Black', 'Montserrat', 'Segoe UI', sans-serif"
          font-size="270"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          fill="url(#gold3D)"
          stroke="#FFF8E5"
          stroke-width="2.5">S</text>

    <text x="470" y="438"
          font-family="'Arial Black', 'Montserrat', 'Segoe UI', sans-serif"
          font-size="270"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          fill="url(#chrome3D)"
          stroke="url(#gold3D)"
          stroke-width="2.5">F</text>
  </g>

  <!-- Metallic Pill Badge for ENTRETENIMIENTO -->
  <rect x="145" y="515" width="510" height="68" rx="34" fill="#0D080C" stroke="url(#gold3D)" stroke-width="2" filter="url(#heavy3D)"/>
  <text x="400" y="559"
        font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
        font-size="29"
        font-weight="800"
        letter-spacing="11"
        text-anchor="middle"
        fill="#F5F7FA">ENTRETENIMIENTO</text>

  <text x="400" y="632"
        font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="8"
        text-anchor="middle"
        fill="url(#gold3D)">EXPERIENCIAS Y EVENTOS DE ALTO NIVEL</text>
</svg>